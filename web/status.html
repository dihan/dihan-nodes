<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115">
<title>ComfyUI Status</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --line: #262b36;
    --text: #e6e8ee;
    --muted: #878da0;
    --accent: #4f8cff;
    --good: #35c27a;
    --warn: #f0a93b;
    --bad: #e5484d;
    --track: #22262f;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f8; --card: #ffffff; --line: #e2e5ec; --text: #171a21;
      --muted: #666d80; --track: #e6e9f0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px 12px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 12px; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 2px 2px 0;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 11px; }
  .pill {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--track); color: var(--muted);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.running { color: var(--accent); }
  .pill.running .dot { animation: pulse 1.1s ease-in-out infinite; }
  .pill.idle { color: var(--good); }
  .pill.error { color: var(--bad); }
  .pill.offline { color: var(--bad); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px;
  }
  .card h2 {
    margin: 0 0 10px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  }

  .bar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar > i {
    display: block; height: 100%; width: 0%; border-radius: 999px;
    background: var(--accent); transition: width .25s ease;
  }
  .bar.good > i { background: var(--good); }
  .bar.warn > i { background: var(--warn); }
  .bar.bad  > i { background: var(--bad); }

  .row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .row .k { color: var(--muted); font-size: 12px; }
  .row .v { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 12px; }
  .big { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .muted { color: var(--muted); }
  .stack { display: grid; gap: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 10px 0; }

  button {
    font: inherit; font-weight: 600; color: var(--text);
    background: var(--track); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 14px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { opacity: .6; }
  button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  button.armed { background: var(--bad); color: #fff; border-color: var(--bad); }

  ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  ul.list li {
    display: flex; gap: 8px; align-items: baseline;
    font-size: 12px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
  }
  ul.list li:last-child { border-bottom: 0; padding-bottom: 0; }
  ul.list li .v { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
  .tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .tag.success, .tag.done { color: var(--good); }
  .tag.running { color: var(--accent); }
  .tag.error { color: var(--bad); }
  .tag.interrupted { color: var(--warn); }

  details > summary {
    cursor: pointer; list-style: none; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: " ▸"; }
  details[open] > summary::after { content: " ▾"; }
  pre#log {
    margin: 10px 0 0; max-height: 45vh; overflow: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
    padding: 10px; font-size: 11px; line-height: 1.5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
    -webkit-overflow-scrolling: touch;
  }
  .err {
    margin-top: 10px; padding: 9px 11px; border-radius: 9px; font-size: 12px;
    background: color-mix(in srgb, var(--bad) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
  }

  /* --- tabs -------------------------------------------------------------- */
  /* [hidden] needs the !important: the panels below set display:grid, which
     would otherwise win and show a hidden panel anyway. */
  [hidden] { display: none !important; }

  .tabs { display: flex; gap: 6px; }
  .tabs > button {
    flex: 1; padding: 8px 10px; font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tabs > button.on {
    background: var(--accent); color: #fff;
    border-color: var(--accent);
  }
  .badge {
    min-width: 17px; padding: 1px 5px; border-radius: 999px;
    font-size: 10px; font-weight: 700; line-height: 1.5;
    background: var(--bad); color: #fff;
  }
  .tabs > button.on .badge { background: rgba(255, 255, 255, .25); }

  #panel-status, #panel-crashes { display: grid; gap: 12px; }

  /* --- failures ---------------------------------------------------------- */
  .tag.oom { color: var(--warn); }
  .tag.killed { color: var(--bad); }

  details.fail { border-bottom: 1px solid var(--line); padding: 8px 0; }
  details.fail:last-child { border-bottom: 0; padding-bottom: 0; }
  details.fail:first-child { padding-top: 0; }
  /* Override the small-caps summary styling used by the terminal log box. */
  details.fail > summary {
    display: flex; gap: 8px; align-items: baseline;
    font-size: 12px; font-weight: 500; text-transform: none;
    letter-spacing: normal; color: var(--text);
  }
  details.fail > summary::after { content: ""; }
  details.fail > summary .flabel {
    font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  details.fail > summary .v { margin-left: auto; color: var(--muted); font-size: 11px; white-space: nowrap; }
  details.fail[open] > summary { margin-bottom: 8px; }

  .fmsg {
    font-size: 12px; color: var(--muted); margin: 4px 0 0 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  details.fail[open] .fmsg { white-space: normal; }

  .fsec { margin-top: 10px; }
  .fsec > .h {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); margin-bottom: 4px;
  }
  pre.snip {
    margin: 0; max-height: 30vh; overflow: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px; font-size: 11px; line-height: 1.45;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
    -webkit-overflow-scrolling: touch;
  }
  pre.snip.kernel {
    background: color-mix(in srgb, var(--warn) 10%, transparent);
    border-color: color-mix(in srgb, var(--warn) 35%, transparent);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>ComfyUI</h1>
      <div class="sub" id="serverline">connecting…</div>
    </div>
    <span class="pill" id="pill"><span class="dot"></span><span id="pilltext">…</span></span>
  </header>

  <nav class="tabs">
    <button class="on" data-panel="status">Status</button>
    <button data-panel="crashes">Crashes<span class="badge" id="crashbadge" hidden></span></button>
  </nav>

  <div id="panel-status">

  <section class="card" id="runcard">
    <h2>Current run</h2>
    <div id="runbody"><div class="empty">Idle</div></div>
  </section>

  <section class="card">
    <h2>Queue</h2>
    <div id="queuebody"><div class="empty">—</div></div>
  </section>

  <section class="card">
    <h2>Resources</h2>
    <div class="stack" id="resbody"><div class="empty">—</div></div>
  </section>

  <section class="card" id="histcard" hidden>
    <h2>Recent runs</h2>
    <ul class="list" id="histbody"></ul>
  </section>

  <section class="card">
    <details id="logbox">
      <summary>Terminal log</summary>
      <pre id="log">…</pre>
    </details>
  </section>

  </div><!-- /panel-status -->

  <div id="panel-crashes" hidden>

    <section class="card">
      <h2>Process crashes</h2>
      <div id="crashbody"><div class="empty">…</div></div>
    </section>

    <section class="card" id="failcard" hidden>
      <h2>Node failures</h2>
      <div id="failbody"></div>
    </section>

  </div><!-- /panel-crashes -->

</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var API = location.pathname.replace(/\/+$/, "") + "/api";
  var failures = 0;
  var armed = false;
  var armedTimer = null;
  var logStick = true;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function dur(sec) {
    if (sec == null || !isFinite(sec)) return "—";
    sec = Math.max(0, Math.round(sec));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h) return h + "h " + m + "m";
    if (m) return m + "m " + (s < 10 ? "0" : "") + s + "s";
    return s + "s";
  }

  function bytes(n) {
    if (n == null) return "—";
    var u = ["B", "KB", "MB", "GB", "TB"], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (n >= 100 || i === 0 ? Math.round(n) : n.toFixed(1)) + " " + u[i];
  }

  function pct(frac) {
    return frac == null ? "—" : Math.round(frac * 100) + "%";
  }

  function bar(frac, cls) {
    var w = frac == null ? 0 : Math.max(0, Math.min(1, frac)) * 100;
    return '<div class="bar ' + (cls || "") + '"><i style="width:' + w.toFixed(1) + '%"></i></div>';
  }

  function meter(label, used, total, note) {
    var frac = total ? used / total : null;
    var cls = frac == null ? "" : frac > 0.9 ? "bad" : frac > 0.75 ? "warn" : "good";
    return '<div>' +
      '<div class="row"><span class="k">' + esc(label) + '</span>' +
      '<span class="v">' + bytes(used) + " / " + bytes(total) +
      (note ? ' <span class="muted">' + esc(note) + "</span>" : "") + "</span></div>" +
      bar(frac, cls) + "</div>";
  }

  function setPill(cls, text) {
    var p = $("pill");
    p.className = "pill " + cls;
    $("pilltext").textContent = text;
  }

  function renderRun(d) {
    var run = d.run;
    var host = $("runbody");
    if (!run) {
      var last = (d.history && d.history[0]) || null;
      host.innerHTML = '<div class="empty">Idle' +
        (last ? ' · last run ' + esc(dur(last.duration)) : "") + "</div>" +
        (last && last.error ? errBlock(last.error) : "");
      return;
    }

    var node = run.node || {};
    var html = "";

    html += '<div class="row"><span class="big">' +
      esc(node.label || (node.id ? "node " + node.id : "starting…")) +
      '</span><span class="v big">' + pct(run.overall) + "</span></div>";
    html += bar(run.overall);

    html += '<div class="row" style="margin-top:12px"><span class="k">Elapsed</span>' +
      '<span class="v">' + dur(run.elapsed) + "</span></div>";

    if (node.max > 0) {
      html += '<div class="row"><span class="k">Step</span><span class="v">' +
        Math.round(node.value) + " / " + Math.round(node.max) +
        (node.eta != null ? ' <span class="muted">· ' + dur(node.eta) + " left</span>" : "") +
        "</span></div>";
      html += bar(node.value / node.max, "good");
    }

    if (run.nodes_total) {
      html += '<div class="row" style="margin-top:10px"><span class="k">Nodes</span>' +
        '<span class="v">' + run.nodes_done + " / " + run.nodes_total + "</span></div>";
    }
    if (run.prompt_id) {
      html += '<div class="row"><span class="k">Prompt</span><span class="v mono">' +
        esc(String(run.prompt_id).slice(0, 8)) + "</span></div>";
    }

    html += '<div style="margin-top:12px"><button class="danger" id="interrupt">' +
      (armed ? "Tap again to confirm" : "Interrupt") + "</button></div>";

    host.innerHTML = html;
    if (armed) $("interrupt").classList.add("armed");
    $("interrupt").onclick = onInterrupt;
  }

  function errBlock(err) {
    if (!err) return "";
    return '<div class="err"><strong>' + esc(err.node_type || "Error") + "</strong><br>" +
      esc(err.message || "") + "</div>";
  }

  function onInterrupt() {
    if (!armed) {
      armed = true;
      renderRun(window.__last || {});
      clearTimeout(armedTimer);
      armedTimer = setTimeout(function () { armed = false; renderRun(window.__last || {}); }, 4000);
      return;
    }
    armed = false;
    clearTimeout(armedTimer);
    fetch("/interrupt", { method: "POST" }).catch(function () {});
  }

  function renderQueue(d) {
    var q = d.queue || {};
    var html = '<div class="row"><span class="k">Pending</span><span class="v big">' +
      (q.remaining != null ? q.remaining : "—") + "</span></div>";

    var items = (q.running || []).map(function (it) { return [it, "running"]; })
      .concat((q.pending || []).slice(0, 8).map(function (it) { return [it, "queued"]; }));

    if (items.length) {
      html += '<ul class="list" style="margin-top:10px">' + items.map(function (pair) {
        var it = pair[0];
        return "<li><span class='tag " + pair[1] + "'>" + pair[1] + "</span>" +
          "<span class='mono'>" + (it.number != null ? "#" + esc(it.number) : "") + "</span>" +
          "<span class='muted mono' style='font-size:11px'>" +
          esc(String(it.prompt_id || "").slice(0, 8)) + "</span>" +
          "<span class='v'>" + (it.nodes != null ? it.nodes + " nodes" : "") + "</span></li>";
      }).join("") + "</ul>";
      var hidden = (q.pending || []).length - 8;
      if (hidden > 0) html += '<div class="muted" style="font-size:11px;margin-top:8px">+' + hidden + " more queued</div>";
    }
    $("queuebody").innerHTML = html;
  }

  function renderResources(d) {
    var sys = d.system || {};
    var parts = [];

    (sys.devices || []).forEach(function (dev) {
      var total = dev.vram_total, free = dev.vram_free;
      if (total) parts.push(meter(dev.name || dev.type || "GPU", total - free, total, "VRAM"));
      if (dev.torch_vram_total) {
        parts.push('<div class="row"><span class="k">Torch reserved</span><span class="v">' +
          bytes(dev.torch_vram_total - dev.torch_vram_free) + " / " + bytes(dev.torch_vram_total) +
          "</span></div>");
      }
    });

    if (sys.ram_total) parts.push(meter("System RAM", sys.ram_total - sys.ram_free, sys.ram_total));

    $("resbody").innerHTML = parts.length ? parts.join("") : '<div class="empty">Unavailable</div>';
  }

  function renderHistory(d) {
    var hist = d.history || [];
    $("histcard").hidden = hist.length === 0;
    var now = d.now || 0;
    $("histbody").innerHTML = hist.slice(0, 6).map(function (h) {
      var ago = h.ended && now ? dur(now - h.ended) + " ago" : "";
      return "<li><span class='tag " + esc(h.status) + "'>" + esc(h.status) + "</span>" +
        "<span class='mono'>" + esc(String(h.prompt_id || "").slice(0, 8)) + "</span>" +
        "<span class='v'>" + dur(h.duration) +
        (ago ? " <span class='muted'>· " + esc(ago) + "</span>" : "") + "</span></li>";
    }).join("");
  }

  // --- failures -----------------------------------------------------------
  // Summaries ride along in every snapshot; the heavy detail (traceback, log
  // tail, kernel lines) is pulled once, on demand, when an entry is expanded.
  var failSig = "";
  var failDetail = null;
  var failPending = false;

  function snip(title, text, cls) {
    if (!text) return "";
    return '<div class="fsec"><div class="h">' + esc(title) + "</div>" +
      '<pre class="snip ' + (cls || "") + '">' + esc(text) + "</pre></div>";
  }

  function frow(k, v) {
    if (v == null || v === "") return "";
    return '<div class="row"><span class="k">' + esc(k) +
      '</span><span class="v">' + esc(v) + "</span></div>";
  }

  function failBody(f) {
    if (!f) return '<div class="muted" style="font-size:11px">Detail unavailable.</div>';
    var html = "";
    html += frow("Type", f.exception_type);
    html += frow("Node", f.node_id ? (f.node_label || "") + " (#" + f.node_id + ")" : f.node_label);
    if (f.elapsed != null) html += frow("Failed after", dur(f.elapsed));

    var dev = (f.memory && f.memory.devices || [])[0];
    if (dev && dev.vram_total) {
      html += frow("VRAM at failure",
        bytes(dev.vram_total - dev.vram_free) + " / " + bytes(dev.vram_total));
    }
    if (f.memory && f.memory.ram_total) {
      html += frow("RAM at failure",
        bytes(f.memory.ram_total - f.memory.ram_free) + " / " + bytes(f.memory.ram_total));
    }

    html += snip("Message", f.message);
    html += snip("Kernel evidence", (f.kernel || []).join("\n"), "kernel");
    html += snip("Traceback", (f.traceback || []).join(""));
    html += snip("Log tail", (f.log_tail || []).join("\n"));
    return html;
  }

  function fillDetail(el) {
    var host = el.querySelector(".fdetail");
    if (!host || host.dataset.filled) return;
    var f = failDetail && failDetail[el.dataset.id];
    if (!f) return;
    host.innerHTML = failBody(f);
    host.dataset.filled = "1";
  }

  function loadDetail(el) {
    if (failDetail) { fillDetail(el); return; }
    if (failPending) return;
    failPending = true;
    fetch(API + "/failures?limit=10", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        failDetail = {};
        (d.failures || []).forEach(function (f) { failDetail[f.id] = f; });
        var open = document.querySelectorAll("details.fail[open]");
        for (var i = 0; i < open.length; i++) fillDetail(open[i]);
      })
      .catch(function () {})
      .finally(function () { failPending = false; });
  }

  function renderFailures(d) {
    var list = d.failures || [];
    $("failcard").hidden = list.length === 0;
    if (!list.length) { failSig = ""; return; }

    var now = d.now || 0;
    var sig = list.map(function (f) { return f.id; }).join("|");

    if (sig === failSig) {
      // Same failures -- refresh the relative times only, so an entry the
      // user has expanded is not collapsed out from under them every poll.
      var stamps = $("failbody").querySelectorAll("summary .v");
      for (var i = 0; i < stamps.length && i < list.length; i++) {
        stamps[i].textContent = list[i].at && now ? dur(now - list[i].at) + " ago" : "";
      }
      return;
    }
    failSig = sig;
    failDetail = null;  // a new failure landed; the cached detail is stale

    $("failbody").innerHTML = list.map(function (f) {
      var tag = f.oom ? "oom" : f.kind === "process_died" ? "killed" : "error";
      var tagText = f.oom ? "OOM" : f.kind === "process_died" ? "killed" : "error";
      var ago = f.at && now ? dur(now - f.at) + " ago" : "";
      return '<details class="fail" data-id="' + esc(f.id) + '">' +
        "<summary><span class='tag " + tag + "'>" + tagText + "</span>" +
        '<span class="flabel">' +
        esc(f.node_label || f.exception_type || "Failure") + "</span>" +
        '<span class="v">' + esc(ago) + "</span></summary>" +
        '<div class="fmsg">' + esc(f.message || "") + "</div>" +
        '<div class="fdetail"></div></details>';
    }).join("");

    // `toggle` does not bubble, so each entry needs its own listener.
    var nodes = $("failbody").querySelectorAll("details.fail");
    for (var j = 0; j < nodes.length; j++) {
      nodes[j].addEventListener("toggle", function () {
        if (this.open) loadDetail(this);
      });
    }
  }

  // --- crash history ------------------------------------------------------
  // Read back from the service journal rather than from anything this page
  // recorded, so it can explain a crash that took the page down with it --
  // including crashes from before this feature existed.
  var crashTimer = null;
  var crashLoaded = false;

  function clock(at) {
    if (!at) return "";
    try { return new Date(at * 1000).toLocaleString(); } catch (e) { return ""; }
  }

  function renderCrashes(d) {
    var host = $("crashbody");

    if (!d.available) {
      host.innerHTML = '<div class="empty">' +
        esc(d.reason || "Crash history unavailable.") + "</div>";
      return;
    }

    var list = d.crashes || [];
    var oomCount = list.filter(function (c) { return c.oom; }).length;

    var badge = $("crashbadge");
    if (list.length) {
      badge.hidden = false;
      badge.textContent = d.total != null ? d.total : list.length;
    } else {
      badge.hidden = true;
    }

    if (!list.length) {
      host.innerHTML = '<div class="empty">No crashes recorded for ' +
        esc(d.unit || "this service") + " in the last 14 days.</div>";
      return;
    }

    var head = "";
    if (oomCount >= 2) {
      // Repeated kills of the same shape are a capacity problem, not bad luck.
      head = '<div class="err" style="margin:0 0 12px">' +
        "<strong>" + oomCount + " out-of-memory kills</strong><br>" +
        "The machine keeps running out of RAM and the kernel is killing " +
        "ComfyUI. Raising the WSL memory limit or lowering peak usage is the " +
        "fix; restarting only resets the clock.</div>";
    }

    var now = Date.now() / 1000;
    host.innerHTML = head + list.map(function (c) {
      var tag = c.oom ? "oom" : "killed";
      var tagText = c.oom ? "OOM" : "exit " + esc(c.status);
      var ago = c.at ? dur(now - c.at) + " ago" : "";
      var body = "";
      body += frow("When", clock(c.at));
      body += frow("Exit", "code=" + c.code + " status=" + c.status);
      if (c.downtime != null) body += frow("Restarted after", dur(c.downtime));
      else body += frow("Restarted", "no restart seen in the journal");
      body += snip("Kernel evidence", (c.kernel || []).join("\n"), "kernel");

      return '<details class="fail">' +
        "<summary><span class='tag " + tag + "'>" + tagText + "</span>" +
        '<span class="flabel">' + esc(clock(c.at)) + "</span>" +
        '<span class="v">' + esc(ago) + "</span></summary>" +
        '<div class="fmsg">' + esc(c.reason || "") + "</div>" +
        '<div class="fdetail">' + body + "</div></details>";
    }).join("");
  }

  function pullCrashes() {
    fetch(API + "/crashes?limit=15", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { crashLoaded = true; renderCrashes(d); })
      .catch(function () {
        if (!crashLoaded) {
          $("crashbody").innerHTML = '<div class="empty">Could not load crash history.</div>';
        }
      })
      .finally(function () {
        clearTimeout(crashTimer);
        // Only keep polling while the tab is actually being looked at; the
        // server caches these reads, but the journal scan is not free.
        if (!$("panel-crashes").hidden && !document.hidden) {
          crashTimer = setTimeout(pullCrashes, 30000);
        }
      });
  }

  // --- tabs ---------------------------------------------------------------
  function showPanel(name) {
    var crashes = name === "crashes";
    $("panel-status").hidden = crashes;
    $("panel-crashes").hidden = !crashes;

    var buttons = document.querySelectorAll(".tabs > button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle("on", buttons[i].dataset.panel === name);
    }
    try { localStorage.setItem("dihanStatusTab", name); } catch (e) {}
    if (crashes) pullCrashes(); else clearTimeout(crashTimer);
  }

  (function initTabs() {
    var buttons = document.querySelectorAll(".tabs > button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener("click", function () {
        showPanel(this.dataset.panel);
      });
    }
    var want = location.hash === "#crashes" ? "crashes" : null;
    if (!want) {
      try { want = localStorage.getItem("dihanStatusTab"); } catch (e) {}
    }
    showPanel(want === "crashes" ? "crashes" : "status");
  })();

  function render(d) {
    window.__last = d;
    var srv = d.server || {};
    $("serverline").textContent = [
      srv.comfyui_version ? "v" + srv.comfyui_version : null,
      srv.pytorch_version ? "torch " + srv.pytorch_version : null,
      "up " + dur(srv.uptime)
    ].filter(Boolean).join(" · ");

    var newest = (d.failures && d.failures[0]) || null;
    if (d.state === "running") setPill("running", "Running");
    else if (d.history && d.history[0] && d.history[0].status === "error") {
      setPill("error", newest && newest.oom ? "Last run OOM'd" : "Last run failed");
    } else if (newest && newest.kind === "process_died" &&
               !(d.history && d.history.length)) {
      // Nothing has run in this process yet, but the previous one died
      // mid-run. Surfacing that is the point of persisting it across the
      // restart; the first completed run here supersedes it.
      setPill("error", newest.oom ? "Previous run OOM-killed" : "Previous run died");
    } else setPill("idle", "Idle");

    renderRun(d);
    renderQueue(d);
    renderResources(d);
    renderFailures(d);
    renderHistory(d);
  }

  function tick() {
    fetch(API + "/snapshot", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        failures = 0;
        render(d);
        // Back right off while the tab is hidden, but never stop entirely --
        // otherwise a backgrounded tab shows stale data when you return to it.
        schedule(document.hidden ? 20000 : d.state === "running" ? 1000 : 3000);
      })
      .catch(function () {
        failures++;
        setPill("offline", failures > 2 ? "Offline" : "Reconnecting…");
        schedule(Math.min(2000 * failures, 15000));
      });
  }

  var timer = null;
  function schedule(ms) {
    clearTimeout(timer);
    timer = setTimeout(tick, ms);
  }

  // --- logs ---------------------------------------------------------------
  var logTimer = null;
  var logEl = $("log");

  logEl.addEventListener("scroll", function () {
    logStick = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  });

  function pullLogs() {
    if (!$("logbox").open) return;
    fetch(API + "/logs?tail=200", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) { logEl.textContent = "log unavailable: " + d.error; return; }
        logEl.textContent = (d.entries || []).map(function (e) { return e.m; }).join("").trimEnd()
          || "(empty)";
        if (logStick) logEl.scrollTop = logEl.scrollHeight;
      })
      .catch(function () {})
      .finally(function () {
        clearTimeout(logTimer);
        if ($("logbox").open) logTimer = setTimeout(pullLogs, document.hidden ? 8000 : 2500);
      });
  }

  $("logbox").addEventListener("toggle", function () {
    if ($("logbox").open) { logStick = true; pullLogs(); }
    else clearTimeout(logTimer);
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    schedule(0);
    pullLogs();
    if (!$("panel-crashes").hidden) pullCrashes();
  });

  tick();

  // Populate the tab badge on load even when the Status tab is showing, so a
  // crash while you were away is visible without going looking for it.
  if ($("panel-crashes").hidden) pullCrashes();
})();
</script>
</body>
</html>
