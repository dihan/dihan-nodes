<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115">
<title>ComfyUI Status</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --line: #262b36;
    --text: #e6e8ee;
    --muted: #878da0;
    --accent: #4f8cff;
    --good: #35c27a;
    --warn: #f0a93b;
    --bad: #e5484d;
    --track: #22262f;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f8; --card: #ffffff; --line: #e2e5ec; --text: #171a21;
      --muted: #666d80; --track: #e6e9f0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px 12px calc(24px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 12px; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 2px 2px 0;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 11px; }
  .pill {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--track); color: var(--muted);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.running { color: var(--accent); }
  .pill.running .dot { animation: pulse 1.1s ease-in-out infinite; }
  .pill.idle { color: var(--good); }
  .pill.error { color: var(--bad); }
  .pill.offline { color: var(--bad); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px;
  }
  .card h2 {
    margin: 0 0 10px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  }

  .bar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar > i {
    display: block; height: 100%; width: 0%; border-radius: 999px;
    background: var(--accent); transition: width .25s ease;
  }
  .bar.good > i { background: var(--good); }
  .bar.warn > i { background: var(--warn); }
  .bar.bad  > i { background: var(--bad); }

  .row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .row .k { color: var(--muted); font-size: 12px; }
  .row .v { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 12px; }
  .big { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .muted { color: var(--muted); }
  .stack { display: grid; gap: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 10px 0; }

  button {
    font: inherit; font-weight: 600; color: var(--text);
    background: var(--track); border: 1px solid var(--line);
    border-radius: 9px; padding: 9px 14px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { opacity: .6; }
  button.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  button.armed { background: var(--bad); color: #fff; border-color: var(--bad); }

  ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  ul.list li {
    display: flex; gap: 8px; align-items: baseline;
    font-size: 12px; padding-bottom: 7px; border-bottom: 1px solid var(--line);
  }
  ul.list li:last-child { border-bottom: 0; padding-bottom: 0; }
  ul.list li .v { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
  .tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  .tag.success, .tag.done { color: var(--good); }
  .tag.running { color: var(--accent); }
  .tag.error { color: var(--bad); }
  .tag.interrupted { color: var(--warn); }

  details > summary {
    cursor: pointer; list-style: none; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: " ▸"; }
  details[open] > summary::after { content: " ▾"; }
  pre#log {
    margin: 10px 0 0; max-height: 45vh; overflow: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
    padding: 10px; font-size: 11px; line-height: 1.5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
    -webkit-overflow-scrolling: touch;
  }
  .err {
    margin-top: 10px; padding: 9px 11px; border-radius: 9px; font-size: 12px;
    background: color-mix(in srgb, var(--bad) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>ComfyUI</h1>
      <div class="sub" id="serverline">connecting…</div>
    </div>
    <span class="pill" id="pill"><span class="dot"></span><span id="pilltext">…</span></span>
  </header>

  <section class="card" id="runcard">
    <h2>Current run</h2>
    <div id="runbody"><div class="empty">Idle</div></div>
  </section>

  <section class="card">
    <h2>Queue</h2>
    <div id="queuebody"><div class="empty">—</div></div>
  </section>

  <section class="card">
    <h2>Resources</h2>
    <div class="stack" id="resbody"><div class="empty">—</div></div>
  </section>

  <section class="card" id="histcard" hidden>
    <h2>Recent runs</h2>
    <ul class="list" id="histbody"></ul>
  </section>

  <section class="card">
    <details id="logbox">
      <summary>Terminal log</summary>
      <pre id="log">…</pre>
    </details>
  </section>

</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var API = location.pathname.replace(/\/+$/, "") + "/api";
  var failures = 0;
  var armed = false;
  var armedTimer = null;
  var logStick = true;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function dur(sec) {
    if (sec == null || !isFinite(sec)) return "—";
    sec = Math.max(0, Math.round(sec));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h) return h + "h " + m + "m";
    if (m) return m + "m " + (s < 10 ? "0" : "") + s + "s";
    return s + "s";
  }

  function bytes(n) {
    if (n == null) return "—";
    var u = ["B", "KB", "MB", "GB", "TB"], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (n >= 100 || i === 0 ? Math.round(n) : n.toFixed(1)) + " " + u[i];
  }

  function pct(frac) {
    return frac == null ? "—" : Math.round(frac * 100) + "%";
  }

  function bar(frac, cls) {
    var w = frac == null ? 0 : Math.max(0, Math.min(1, frac)) * 100;
    return '<div class="bar ' + (cls || "") + '"><i style="width:' + w.toFixed(1) + '%"></i></div>';
  }

  function meter(label, used, total, note) {
    var frac = total ? used / total : null;
    var cls = frac == null ? "" : frac > 0.9 ? "bad" : frac > 0.75 ? "warn" : "good";
    return '<div>' +
      '<div class="row"><span class="k">' + esc(label) + '</span>' +
      '<span class="v">' + bytes(used) + " / " + bytes(total) +
      (note ? ' <span class="muted">' + esc(note) + "</span>" : "") + "</span></div>" +
      bar(frac, cls) + "</div>";
  }

  function setPill(cls, text) {
    var p = $("pill");
    p.className = "pill " + cls;
    $("pilltext").textContent = text;
  }

  function renderRun(d) {
    var run = d.run;
    var host = $("runbody");
    if (!run) {
      var last = (d.history && d.history[0]) || null;
      host.innerHTML = '<div class="empty">Idle' +
        (last ? ' · last run ' + esc(dur(last.duration)) : "") + "</div>" +
        (last && last.error ? errBlock(last.error) : "");
      return;
    }

    var node = run.node || {};
    var html = "";

    html += '<div class="row"><span class="big">' +
      esc(node.label || (node.id ? "node " + node.id : "starting…")) +
      '</span><span class="v big">' + pct(run.overall) + "</span></div>";
    html += bar(run.overall);

    html += '<div class="row" style="margin-top:12px"><span class="k">Elapsed</span>' +
      '<span class="v">' + dur(run.elapsed) + "</span></div>";

    if (node.max > 0) {
      html += '<div class="row"><span class="k">Step</span><span class="v">' +
        Math.round(node.value) + " / " + Math.round(node.max) +
        (node.eta != null ? ' <span class="muted">· ' + dur(node.eta) + " left</span>" : "") +
        "</span></div>";
      html += bar(node.value / node.max, "good");
    }

    if (run.nodes_total) {
      html += '<div class="row" style="margin-top:10px"><span class="k">Nodes</span>' +
        '<span class="v">' + run.nodes_done + " / " + run.nodes_total + "</span></div>";
    }
    if (run.prompt_id) {
      html += '<div class="row"><span class="k">Prompt</span><span class="v mono">' +
        esc(String(run.prompt_id).slice(0, 8)) + "</span></div>";
    }

    html += '<div style="margin-top:12px"><button class="danger" id="interrupt">' +
      (armed ? "Tap again to confirm" : "Interrupt") + "</button></div>";

    host.innerHTML = html;
    if (armed) $("interrupt").classList.add("armed");
    $("interrupt").onclick = onInterrupt;
  }

  function errBlock(err) {
    if (!err) return "";
    return '<div class="err"><strong>' + esc(err.node_type || "Error") + "</strong><br>" +
      esc(err.message || "") + "</div>";
  }

  function onInterrupt() {
    if (!armed) {
      armed = true;
      renderRun(window.__last || {});
      clearTimeout(armedTimer);
      armedTimer = setTimeout(function () { armed = false; renderRun(window.__last || {}); }, 4000);
      return;
    }
    armed = false;
    clearTimeout(armedTimer);
    fetch("/interrupt", { method: "POST" }).catch(function () {});
  }

  function renderQueue(d) {
    var q = d.queue || {};
    var html = '<div class="row"><span class="k">Pending</span><span class="v big">' +
      (q.remaining != null ? q.remaining : "—") + "</span></div>";

    var items = (q.running || []).map(function (it) { return [it, "running"]; })
      .concat((q.pending || []).slice(0, 8).map(function (it) { return [it, "queued"]; }));

    if (items.length) {
      html += '<ul class="list" style="margin-top:10px">' + items.map(function (pair) {
        var it = pair[0];
        return "<li><span class='tag " + pair[1] + "'>" + pair[1] + "</span>" +
          "<span class='mono'>" + (it.number != null ? "#" + esc(it.number) : "") + "</span>" +
          "<span class='muted mono' style='font-size:11px'>" +
          esc(String(it.prompt_id || "").slice(0, 8)) + "</span>" +
          "<span class='v'>" + (it.nodes != null ? it.nodes + " nodes" : "") + "</span></li>";
      }).join("") + "</ul>";
      var hidden = (q.pending || []).length - 8;
      if (hidden > 0) html += '<div class="muted" style="font-size:11px;margin-top:8px">+' + hidden + " more queued</div>";
    }
    $("queuebody").innerHTML = html;
  }

  function renderResources(d) {
    var sys = d.system || {};
    var parts = [];

    (sys.devices || []).forEach(function (dev) {
      var total = dev.vram_total, free = dev.vram_free;
      if (total) parts.push(meter(dev.name || dev.type || "GPU", total - free, total, "VRAM"));
      if (dev.torch_vram_total) {
        parts.push('<div class="row"><span class="k">Torch reserved</span><span class="v">' +
          bytes(dev.torch_vram_total - dev.torch_vram_free) + " / " + bytes(dev.torch_vram_total) +
          "</span></div>");
      }
    });

    if (sys.ram_total) parts.push(meter("System RAM", sys.ram_total - sys.ram_free, sys.ram_total));

    $("resbody").innerHTML = parts.length ? parts.join("") : '<div class="empty">Unavailable</div>';
  }

  function renderHistory(d) {
    var hist = d.history || [];
    $("histcard").hidden = hist.length === 0;
    var now = d.now || 0;
    $("histbody").innerHTML = hist.slice(0, 6).map(function (h) {
      var ago = h.ended && now ? dur(now - h.ended) + " ago" : "";
      return "<li><span class='tag " + esc(h.status) + "'>" + esc(h.status) + "</span>" +
        "<span class='mono'>" + esc(String(h.prompt_id || "").slice(0, 8)) + "</span>" +
        "<span class='v'>" + dur(h.duration) +
        (ago ? " <span class='muted'>· " + esc(ago) + "</span>" : "") + "</span></li>";
    }).join("");
  }

  function render(d) {
    window.__last = d;
    var srv = d.server || {};
    $("serverline").textContent = [
      srv.comfyui_version ? "v" + srv.comfyui_version : null,
      srv.pytorch_version ? "torch " + srv.pytorch_version : null,
      "up " + dur(srv.uptime)
    ].filter(Boolean).join(" · ");

    if (d.state === "running") setPill("running", "Running");
    else if (d.history && d.history[0] && d.history[0].status === "error") setPill("error", "Last run failed");
    else setPill("idle", "Idle");

    renderRun(d);
    renderQueue(d);
    renderResources(d);
    renderHistory(d);
  }

  function tick() {
    fetch(API + "/snapshot", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        failures = 0;
        render(d);
        // Back right off while the tab is hidden, but never stop entirely --
        // otherwise a backgrounded tab shows stale data when you return to it.
        schedule(document.hidden ? 20000 : d.state === "running" ? 1000 : 3000);
      })
      .catch(function () {
        failures++;
        setPill("offline", failures > 2 ? "Offline" : "Reconnecting…");
        schedule(Math.min(2000 * failures, 15000));
      });
  }

  var timer = null;
  function schedule(ms) {
    clearTimeout(timer);
    timer = setTimeout(tick, ms);
  }

  // --- logs ---------------------------------------------------------------
  var logTimer = null;
  var logEl = $("log");

  logEl.addEventListener("scroll", function () {
    logStick = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
  });

  function pullLogs() {
    if (!$("logbox").open) return;
    fetch(API + "/logs?tail=200", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) { logEl.textContent = "log unavailable: " + d.error; return; }
        logEl.textContent = (d.entries || []).map(function (e) { return e.m; }).join("").trimEnd()
          || "(empty)";
        if (logStick) logEl.scrollTop = logEl.scrollHeight;
      })
      .catch(function () {})
      .finally(function () {
        clearTimeout(logTimer);
        if ($("logbox").open) logTimer = setTimeout(pullLogs, document.hidden ? 8000 : 2500);
      });
  }

  $("logbox").addEventListener("toggle", function () {
    if ($("logbox").open) { logStick = true; pullLogs(); }
    else clearTimeout(logTimer);
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { schedule(0); pullLogs(); }
  });

  tick();
})();
</script>
</body>
</html>
